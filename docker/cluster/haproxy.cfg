global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# ----------------------------------------------------------------------
# Web Dashboard GUI - Realtime Node Health & Connection Stats
# ----------------------------------------------------------------------
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:secret

# ----------------------------------------------------------------------
# MySQL Cluster Primary Entrypoint (Port 3306)
# Writer Active-Passive Failover: Node 1 primary writer, Node 2 & 3 backup
# Prevents optimistic concurrency rollbacks under high concurrency
# ----------------------------------------------------------------------
frontend mysql_cluster_front
    bind *:3306
    mode tcp
    option tcplog
    default_backend galera_cluster_back

backend galera_cluster_back
    mode tcp
    option tcp-check
    balance roundrobin
    server node1 mariadb-node1:3306 check inter 2s fall 2 rise 2
    server node2 mariadb-node2:3306 check inter 2s fall 2 rise 2 backup
    server node3 mariadb-node3:3306 check inter 2s fall 2 rise 2 backup

# ----------------------------------------------------------------------
# MySQL Read-Only Load Balanced Pool (Port 3308 - Optional)
# Balances SELECT queries evenly across all 3 nodes
# ----------------------------------------------------------------------
frontend mysql_readonly_front
    bind *:3308
    mode tcp
    option tcplog
    default_backend galera_readonly_back

backend galera_readonly_back
    mode tcp
    option tcp-check
    balance roundrobin
    server node1 mariadb-node1:3306 check inter 2s fall 2 rise 2
    server node2 mariadb-node2:3306 check inter 2s fall 2 rise 2
    server node3 mariadb-node3:3306 check inter 2s fall 2 rise 2
